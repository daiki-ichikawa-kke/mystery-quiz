<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きチャレンジ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center; 
            margin: 20px;
            background-image: url(2025-08-27-113757.png); 
        }
        #riddle-container {
            padding: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            gap: 5px;
            width: 250px;
            margin: 0 auto;
        }

        .card img {
            width: 110px;
        }
    </style>
</head>
<body>
    <div id="riddle-container">
        <h2>KKEラボの謎</h2>
        <p>赤色が入っていない国旗の数は？<br>
        <span style="font-size: small;">How many national flags do not contain red?</span></p>
    </div>

    <div class="card-container">
        <div class="card">
            <img src="China.png" alt="中国の国旗">
            </div>
        <div class="card">
            <img src="Indonesia.png" alt="インドネシアの国旗">
            </div>
        <div class="card">
            <img src="Japan.png" alt="日本の国旗">
            </div>
        <div class="card">
            <img src="Korea.png" alt="韓国の国旗">
            </div>
        <div class="card">
            <img src="Micronesia.png" alt="ミクロネシアの国旗">
            </div>
        <div class="card">
            <img src="new zealand.png" alt="ニュージーランドの国旗">
            </div>
        <div class="card">
            <img src="Ireland.png" alt="アイルランドの国旗">
            </div>
        <div class="card">
            <img src="madagascar.png" alt="マダガスカルの国旗">
            </div>
        </div>
</body>
</html>
